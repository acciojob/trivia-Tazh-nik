<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Question - Capital of India</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            color: #1a1a1a;
        }
        .question {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }
        .options {
            margin-bottom: 15px;
        }
        .options label {
            display: block;
            margin-bottom: 6px;
            cursor: pointer;
        }
        blockquote {
            max-width: 600px;
            margin: 10px;
            padding: 15px;
            border-left: 8px solid green;
            background-color: #f8fffe;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <p class="question">What is the captial of India?</p>
        
        <div class="options">
            <label>
                <input type="radio" name="capital" value="new-delhi"> New Delhi
            </label>
            <label>
                <input type="radio" name="capital" value="mumbai"> Mumbai
            </label>
        </div>

        <blockquote cite="https://wikipedia.org">
            New Delhi is the capital of India and an administrative district of NCT Delhi.
        </blockquote>
    </div>

</body>
</html>
